<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bite Point — Material You Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Material You Dark Theme Tokens */
      --md-bg: #111318;
      --md-surface: #1d2026;
      --md-surface-high: #282a31;
      --md-outline: #43474f;
      
      --md-primary: #a8c7fa;
      --md-on-primary: #062e6f;
      --md-primary-container: #284777;
      
      --md-red: #ffb4ab;
      --md-red-active: #ff5449;
      --md-red-container: #93000a;
      
      --md-amber: #ffdf9e;
      --md-amber-active: #fbbc04;
      
      --md-green: #a6f2d1;
      --md-green-container: #00513b;

      --md-text: #e2e2e9;
      --md-text-dim: #8e9099;

      --spring: cubic-bezier(0.2, 0.9, 0.3, 1.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--md-bg);
      color: var(--md-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Bar & Driver Chips */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--md-surface);
      padding: 10px 14px;
      border-radius: 24px;
    }

    .app-title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
      color: var(--md-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .driver-selector {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .chip {
      background: var(--md-surface-high);
      color: var(--md-text-dim);
      border: 1px solid transparent;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip.active {
      background: var(--md-primary-container);
      color: var(--md-primary);
      border-color: rgba(168, 199, 250, 0.3);
    }

    /* Minimalist Material You Lights Card */
    .lights-card {
      background: var(--md-surface);
      border-radius: 32px;
      padding: 28px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 140px;
      position: relative;
      transition: background-color 0.25s ease;
    }

    .light-pill {
      width: 42px;
      height: 54px;
      border-radius: 999px;
      background: var(--md-surface-high);
      transition: all 0.28s var(--spring);
      position: relative;
    }

    /* Active Red Light */
    .light-pill.on {
      height: 82px;
      background: var(--md-red-active);
      box-shadow: 0 0 28px rgba(255, 84, 73, 0.45);
    }

    /* Jump Start / Fault State */
    .light-pill.fault {
      height: 70px;
      background: var(--md-amber-active);
      box-shadow: 0 0 24px rgba(251, 188, 4, 0.4);
      animation: pulseFault 0.35s infinite alternate;
    }

    @keyframes pulseFault {
      from { transform: scale(0.95); opacity: 0.75; }
      to { transform: scale(1.04); opacity: 1; }
    }

    /* Telemetry Display Card */
    .telemetry-card {
      background: var(--md-surface);
      border-radius: 32px;
      padding: 22px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .status-badge {
      align-self: center;
      background: var(--md-surface-high);
      color: var(--md-text-dim);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .status-badge.good {
      background: var(--md-green-container);
      color: var(--md-green);
    }

    .status-badge.penalty {
      background: var(--md-red-container);
      color: var(--md-red);
    }

    .main-timer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.4rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
      color: var(--md-text);
    }

    .main-timer span.unit {
      font-size: 1.4rem;
      color: var(--md-text-dim);
      font-weight: 500;
    }

    /* Q1 / Q2 / Q3 Pills */
    .q-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .q-box {
      background: var(--md-surface-high);
      padding: 10px 8px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1.5px solid transparent;
      transition: all 0.2s ease;
    }

    .q-box.current {
      border-color: var(--md-primary);
      background: rgba(168, 199, 250, 0.08);
    }

    .q-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--md-text-dim);
    }

    .q-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
    }

    /* Interactive Clutch Button (Material You Squircle) */
    .clutch-pad {
      flex: 1;
      min-height: 150px;
      background: var(--md-primary-container);
      color: var(--md-primary);
      border-radius: 36px;
      border: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.22s var(--spring), border-radius 0.25s ease, background-color 0.2s ease;
      touch-action: none;
      position: relative;
      overflow: hidden;
    }

    .clutch-pad.holding {
      transform: scale(0.96);
      border-radius: 48px;
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    .clutch-pad.go-state {
      background: var(--md-green);
      color: var(--md-green-container);
    }

    .clutch-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .clutch-sub {
      font-size: 0.85rem;
      opacity: 0.8;
      font-weight: 600;
    }

    /* Leaderboard Card */
    .leaderboard-card {
      background: var(--md-surface);
      border-radius: 28px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .lb-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--md-text-dim);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .lb-clear {
      background: none;
      border: none;
      color: var(--md-primary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .lb-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 135px;
      overflow-y: auto;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--md-surface-high);
      padding: 9px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      font-weight: 600;
    }

    .lb-item .rank {
      color: var(--md-primary);
      font-weight: 800;
      margin-right: 8px;
    }

    .lb-item .score {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Bar with Quick Player Selection -->
    <div class="top-bar">
      <div class="app-title">● Bite Point</div>
      <div class="driver-selector" id="driverChips">
        <button class="chip active" data-driver="P1">P1</button>
        <button class="chip" data-driver="P2">P2</button>
        <button class="chip" data-driver="P3">P3</button>
        <button class="chip" id="customDriverBtn">+ Ім'я</button>
      </div>
    </div>

    <!-- Minimalist Capsule Lights -->
    <div class="lights-card" id="lightsCard">
      <div class="light-pill"></div>
      <div class="light-pill"></div>
      <div class="light-pill"></div>
      <div class="light-pill"></div>
      <div class="light-pill"></div>
    </div>

    <!-- Telemetry & Q1-Q3 Progress -->
    <div class="telemetry-card">
      <div class="status-badge" id="statusBadge">Готовий до старту</div>
      <div class="main-timer" id="mainTimer">0.000<span class="unit">s</span></div>
      
      <div class="q-grid">
        <div class="q-box current" id="qBox0">
          <span class="q-label">СПРОБА 1</span>
          <span class="q-val" id="qVal0">—</span>
        </div>
        <div class="q-box" id="qBox1">
          <span class="q-label">СПРОБА 2</span>
          <span class="q-val" id="qVal1">—</span>
        </div>
        <div class="q-box" id="qBox2">
          <span class="q-label">СПРОБА 3</span>
          <span class="q-val" id="qVal2">—</span>
        </div>
      </div>
    </div>

    <!-- Tactile Clutch Pad -->
    <button class="clutch-pad" id="clutchPad">
      <span class="clutch-title" id="clutchTitle">Затисни та тримай</span>
      <span class="clutch-sub" id="clutchSub">Відпусти, коли капсули згаснуть</span>
    </button>

    <!-- Local Leaderboard -->
    <div class="leaderboard-card">
      <div class="lb-header">
        <span>Таблиця лідерів (Середній з 3)</span>
        <button class="lb-clear" id="clearLbBtn">Очистити</button>
      </div>
      <div class="lb-list" id="lbList"></div>
    </div>
  </div>

  <script>
    // --- Crisp Micro-Haptics Engine ---
    const Haptics = {
      tap() {
        // Короткий сухий "стук" лінійного вібромотора
        if ("vibrate" in navigator) navigator.vibrate(10);
      },
      lightTick() {
        if ("vibrate" in navigator) navigator.vibrate(12);
      },
      release() {
        // Подвійний мікро-імпульс при старті
        if ("vibrate" in navigator) navigator.vibrate([8, 28, 12]);
      },
      fault() {
        // Три швидких "стуки" замість довгого дзижчання
        if ("vibrate" in navigator) navigator.vibrate([14, 45, 14, 45, 14]);
      }
    };

    // --- Pure Web Audio Synthesizer ---
    let audioCtx = null;
    function playTone(freq = 880, duration = 0.08, type = "sine") {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // --- State & Elements ---
    const pills = document.querySelectorAll(".light-pill");
    const statusBadge = document.getElementById("statusBadge");
    const mainTimer = document.getElementById("mainTimer");
    const clutchPad = document.getElementById("clutchPad");
    const clutchTitle = document.getElementById("clutchTitle");
    const clutchSub = document.getElementById("clutchSub");
    const lbList = document.getElementById("lbList");

    let state = "IDLE"; // IDLE, STAGING, HOLD_RANDOM, LIGHTS_OUT
    let currentDriver = "P1";
    let attempts = [];
    let timers = [];
    let lightsOutTimestamp = 0;

    function clearAllTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function resetLights() {
      pills.forEach(p => p.classList.remove("on", "fault"));
    }

    function updateQBoxes() {
      for (let i = 0; i < 3; i++) {
        const box = document.getElementById(`qBox${i}`);
        const val = document.getElementById(`qVal${i}`);
        box.classList.toggle("current", i === attempts.length && attempts.length < 3);

        if (attempts[i] !== undefined) {
          val.textContent = attempts[i].fault
            ? "+5.000s"
            : `${(attempts[i].ms / 1000).toFixed(3)}s`;
        } else {
          val.textContent = "—";
        }
      }
    }

    // --- Start Sequence (Hold) ---
    function handleHoldStart(e) {
      if (e.cancelable) e.preventDefault();
      if (state !== "IDLE") return;

      // Якщо попередня серія з 3 спроб завершена — очищаємо для нової
      if (attempts.length >= 3) {
        attempts = [];
        updateQBoxes();
      }

      Haptics.tap(); // Той самий приємний стук при натисканні
      state = "STAGING";
      resetLights();

      clutchPad.classList.add("holding");
      clutchPad.classList.remove("go-state");
      clutchTitle.textContent = "Тримай...";
      clutchSub.textContent = "Чекай згасання всіх капсул";
      statusBadge.className = "status-badge";
      statusBadge.textContent = "Відлік старту";
      mainTimer.innerHTML = `0.000<span class="unit">s</span>`;

      // По черзі вмикаємо 5 капсул кожні 1000 мс
      for (let i = 0; i < 5; i++) {
        const t = setTimeout(() => {
          pills[i].classList.add("on");
          Haptics.lightTick();
          playTone(860, 0.085, "sine");

          // Коли засвітилась 5-та капсула — чекаємо рандом (0.2 - 3.0 сек)
          if (i === 4) {
            state = "HOLD_RANDOM";
            const randomDelay = Math.floor(Math.random() * 2800) + 200;
            const outTimer = setTimeout(() => {
              resetLights();
              state = "LIGHTS_OUT";
              lightsOutTimestamp = performance.now();
              clutchPad.classList.add("go-state");
              clutchTitle.textContent = "ВІДПУСКАЙ!";
              statusBadge.textContent = "СТАРТ!";
            }, randomDelay);
            timers.push(outTimer);
          }
        }, (i + 1) * 900);
        timers.push(t);
      }
    }

    // --- Release Sequence ---
    function handleRelease(e) {
      if (e && e.cancelable) e.preventDefault();
      if (state === "IDLE") return;

      clutchPad.classList.remove("holding", "go-state");

      // Якщо відпустив до того, як згасли капсули -> ФАЛЬСТАРТ
      if (state === "STAGING" || state === "HOLD_RANDOM") {
        clearAllTimers();
        state = "IDLE";
        Haptics.fault();
        playTone(220, 0.26, "triangle");

        pills.forEach(p => {
          p.classList.remove("on");
          p.classList.add("fault");
        });

        statusBadge.className = "status-badge penalty";
        statusBadge.textContent = "Фальстарт • Штраф +5с";
        mainTimer.innerHTML = `+5.000<span class="unit">s</span>`;
        recordAttempt(5000, true);
      } 
      // Чесний старт після згасання
      else if (state === "LIGHTS_OUT") {
        const reactionMs = Math.round(performance.now() - lightsOutTimestamp);
        state = "IDLE";
        Haptics.release();
        playTone(1240, 0.11, "sine");

        mainTimer.innerHTML = `${(reactionMs / 1000).toFixed(3)}<span class="unit">s</span>`;
        statusBadge.className = "status-badge good";
        statusBadge.textContent = getVerdict(reactionMs);
        recordAttempt(reactionMs, false);
      }

      clutchTitle.textContent = attempts.length >= 3 ? "Нова серія (Затисни)" : "Затисни та тримай";
      clutchSub.textContent = "Відпусти, коли капсули згаснуть";
    }

    function getVerdict(ms) {
      if (ms < 150) return "Кібер-реакція ⚡";
      if (ms < 210) return "Рівень пілота Ф1 🔥";
      if (ms < 270) return "Солідний старт 👍";
      return "Трохи проспав старт 🐢";
    }

    function recordAttempt(ms, fault) {
      attempts.push({ ms, fault });
      updateQBoxes();

      if (attempts.length === 3) {
        const avgMs = Math.round(attempts.reduce((acc, a) => acc + a.ms, 0) / 3);
        saveToLeaderboard(currentDriver, avgMs);
        setTimeout(() => {
          statusBadge.textContent = `Серія завершена • Сер: ${(avgMs / 1000).toFixed(3)}s`;
        }, 600);
      }
    }

    // --- Leaderboard Logic ---
    function getLeaderboard() {
      try {
        return JSON.parse(localStorage.getItem("bitepoint_md3_lb") || "[]");
      } catch {
        return [];
      }
    }

    function saveToLeaderboard(driver, avgMs) {
      const lb = getLeaderboard();
      lb.push({ driver, avgMs, date: Date.now() });
      lb.sort((a, b) => a.avgMs - b.avgMs);
      localStorage.setItem("bitepoint_md3_lb", JSON.stringify(lb.slice(0, 10)));
      renderLeaderboard();
    }

    function renderLeaderboard() {
      const lb = getLeaderboard();
      if (lb.length === 0) {
        lbList.innerHTML = `<div style="color: var(--md-text-dim); font-size: 0.82rem; text-align:center; padding: 8px;">Поки немає результатів — проїдь 3 спроби</div>`;
        return;
      }
      lbList.innerHTML = lb.map((item, idx) => `
        <div class="lb-item">
          <div><span class="rank">#${idx + 1}</span><span>${item.driver}</span></div>
          <div class="score">${(item.avgMs / 1000).toFixed(3)}s</div>
        </div>
      `).join("");
    }

    // --- Event Listeners ---
    clutchPad.addEventListener("pointerdown", handleHoldStart);
    window.addEventListener("pointerup", handleRelease);
    window.addEventListener("pointercancel", handleRelease);
    window.addEventListener("contextmenu", e => e.preventDefault());

    // Підтримка Пробілу для тесту з ноутбука
    window.addEventListener("keydown", e => {
      if (e.code === "Space" && !e.repeat) handleHoldStart(e);
    });
    window.addEventListener("keyup", e => {
      if (e.code === "Space") handleRelease(e);
    });

    // Перемикання гравців ( чіпси зверху )
    document.getElementById("driverChips").addEventListener("click", e => {
      const btn = e.target.closest(".chip");
      if (!btn) return;

      Haptics.tap();
      if (btn.id === "customDriverBtn") {
        const name = prompt("Введи ім'я або нік (до 8 символів):", currentDriver);
        if (name && name.trim()) {
          currentDriver = name.trim().slice(0, 8).toUpperCase();
          btn.textContent = currentDriver;
        }
      } else {
        currentDriver = btn.dataset.driver;
      }

      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      attempts = [];
      updateQBoxes();
    });

    document.getElementById("clearLbBtn").addEventListener("click", () => {
      Haptics.tap();
      localStorage.removeItem("bitepoint_md3_lb");
      renderLeaderboard();
    });

    renderLeaderboard();
  </script>
</body>
</html>
